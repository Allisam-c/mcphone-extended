# 仓库级的身份 —— 所有平台共用这一份，各平台【不许】自己再定义一遍。
#
# 为什么提到这里
#
# 这个仓库一次发版要出好几个 Minecraft 版本 / 加载器的 jar，而它们必须是【同一个
# 版本号】：玩家在两个版本上装到的 v1.11.0 得是同一次改动。版本号留在各平台的
# gradle.properties 里，它们就能各自漂移 —— 而"老版本悄悄落后"正是这套目录结构
# 要治的病。
#
# 各平台的 build.gradle 显式读这个文件（见 loadRepoProperties），读不到就构建失败。
#
# ⚠ 版本号规则：本仓库是原作者 mod 的二改 fork，版本号写成两段
#   【原作者版本+本 fork 版本】，例如 1.12.1+1.0.0
#   - upstream_version：同步的原作者版本（拉上游更新时跟着改）
#   - fork_version：本 fork 自己的修改版本（自己从 1.0.0 起步往上加）
#   - mod_version：两者拼起来，烧进 jar、游戏内模组列表显示
#   CI 发版时由 .gitea/workflows/release.yml 用标签名覆盖 mod_version
#   （标签 v1.12.1+1.0.0 → mod_version=1.12.1+1.0.0），日常提交不要手改。
mod_id=mcphone
mod_name=MCphone-More versions
mod_license=MIT
mod_group_id=com.november.mcphone
upstream_version=1.12.1
fork_version=1.0.0
mod_version=1.12.1+1.0.0
mod_authors=november521
mod_repo_url=https://github.com/Allisam-c/mcphone-extended

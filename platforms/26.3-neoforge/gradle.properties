# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 【这一支没有 parchment】。1.21.1 那边有 parchment_minecraft_version /
# parchment_mappings_version 两个键，它只补参数名、不改类型名与方法名，加不加都
# 不影响编不编得过（这条写在 versions/targets.json 的 _comment 里）。26.3 上还没有
# 对应的 parchment 构建，硬留着会让配置阶段去解析一个不存在的构件 —— 所以整块删掉，
# build.gradle 里的 parchment { } 也一起删。等它有了再补回来。

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.3
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.3]
# The Neo version must agree with the Minecraft version to get a valid artifact
# 26.3 联动模组的最低要求已经越过 26.3.0.3-beta：AE2 要求 >= .43，
# Tom's / Balm / Curios 要求 >= .37。使用本机已缓存的 .95 userdev 作为基线。
neo_version=26.3.0.115
# 运行时接受的 NeoForge 版本范围，写进 neoforge.mods.toml 的 versionRange。
# 下限钉在编译版上：26.3 这条线还在 beta，它的 API 会动，说"更低版本也兼容"
# 是拿没有验过的话骗玩家。等 26.3 出稳定版再往下松，跟 1.21.1 那支一样。
neo_version_range=[26.3.0.95,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# mod_id / mod_name / mod_license / mod_group_id / mod_version 在【仓库根的
# gradle.properties】里，所有平台共用一份，这里不许重复定义 —— CI 的
# build.yml 里有一道闸专门查这个（「检查平台有没有自己定义仓库级的键」）。

# JavaMP3 解码库的版本。
# 纯 Java、无依赖、MIT 许可，GitHub 上唯一一个非 LGPL 的纯 Java MP3 解码器。
# 上游已于 2023 年归档 —— 对一个 1993 年就冻结的格式来说，这比 API 客户端
# 停止维护的风险小得多；真出问题，MIT 许可让我们可以自己接手。
javamp3_version=1.0.1
# 私有 Rhino 的版本与摘要由 versions/private-rhino.json 集中维护；
# 坐标和打包规则由 gradle/mcphone-engine-dependency.gradle 统一接入。

## 联动模组

# 2026-10-28 通过 Modrinth API 按 game_versions=["26.3"] 与
# loaders=["neoforge"] 查询到的构建。MCEF、NetMusic、Refined Storage 3
# 仍没有 26.3 构件，因此不在依赖表里；对应功能做可选降级。
curios_version=17.0.0-beta.3+26.3
waystones_version=26.3.0.1+neoforge-26.3
balm_version=26.3.0.3+neoforge-26.3
shogi_version=26.3.0.3+neoforge-26.3
patchouli_version=26.1-94-beta
ae2_version=26.3.1-alpha
# 26.3.5 is the newest Modrinth build; 26.3.4 is the complete artifact already
# present in the local Gradle cache and has the same public proxy surface.
guideme_version=26.3.4-alpha
ae2wtlib_version=26.3.1-beta
toms_version=26.3-2.12.3
toms_mod_version=2.12.3

name: Build & Release
# 零 uses 版本：不依赖 github.com 的任何 action。JDK / Gradle / 全部依赖缓存
# JDK 与 Gradle 缓存走 act-toolcache 命名卷（跨任务持久），由 compose 里的
# toolcache-seed 服务从宿主机目录一次性拷入 —— 不依赖任务容器 bind mount
# （act_runner 会把挂载写进 HostConfig 日志但实际不生效）。
#
# 宿主机目录约定（Portainer/文件站里建好）：
#   /volume1/act-runner-files/jdk.tar.gz      JDK 25 Linux tar.gz（PC 下载后上传一次）
#   /volume1/act-runner-files/jdk/            首次构建时自动解压到这里，此后直接用
#   /volume1/act-runner-files/gradle-home/    Gradle 用户目录（PC 的 .gradle 拷一份做种子，
#                                             含 wrapper 发行版与全部依赖缓存）
#
# 任务容器还需要能访问 Gitea 本体：config.yaml 的 options 里已注入
# --add-host=allisam.space:172.17.0.1（容器解析到公网 IP 会自回流超时）。

on:
  push:
    tags:
      - "v*"

env:
  # 任务容器解析不了 allisam.space（公网自回流被丢包，诊断已证实），
  # 直接走宿主机局域网 IP；证书签给域名，对 IP 校验必然失败，
  # 因此 git / curl 均关闭证书校验 —— 纯内网流量，无安全风险
  GITEA_URL: "https://192.168.1.13:3100"

jobs:
  build:
    runs-on: [self-hosted]
    # 挂载必须在 workflow 层声明（act_runner 的 config 只能放行白名单）
    container:
      image: "ghcr.nju.edu.cn/catthehacker/ubuntu:act-latest"
    steps:

      - name: Checkout（从 Gitea 本机克隆）
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}   # Actions 自动注入的仓库令牌
        run: |
          git config --global --add safe.directory '*'
          git config --global http.sslVerify false
          rm -rf workspace
          # 仓库私有，匿名 clone 被 Gitea 以 Not Found 拒绝（诊断已证实）
          git clone --depth 1 "https://allisam:${GITEA_TOKEN}@192.168.1.13:3100/AllisamWorkshop/mcphone-extended.git" \
            --branch "${GITHUB_REF_NAME:-main}" workspace
          cd workspace && ls -la

      - name: Prepare JDK 25（toolcache 卷优先，兜底清华源）
        shell: bash
        run: |
          if [ -x /opt/hostedtoolcache/jdk25/bin/java ]; then
            echo "JDK 已就绪（toolcache 卷）"
          elif [ -f /mnt/jdk.tar.gz ]; then
            echo "解压 /mnt 挂载的 JDK"
            mkdir -p /opt/hostedtoolcache/jdk25
            tar -xzf /mnt/jdk.tar.gz -C /opt/hostedtoolcache/jdk25 --strip-components=1
          else
            echo "toolcache 与挂载都没有 JDK，从清华镜像下载"
            MIRROR="https://mirrors.tuna.tsinghua.edu.cn/Adoptium/25/jdk/x64/linux"
            FILE=$(curl -sfL "$MIRROR/latest.json" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['binaries'][0]['package']['link'].rsplit('/',1)[-1])")
            mkdir -p /opt/hostedtoolcache/jdk25
            curl -sfL "$MIRROR/$FILE" | tar -xz -C /opt/hostedtoolcache/jdk25 --strip-components=1
          fi
          echo "JAVA_HOME=/opt/hostedtoolcache/jdk25" >> $GITHUB_ENV
          echo "/opt/hostedtoolcache/jdk25/bin" >> $GITHUB_PATH
          # $GITHUB_PATH 只对后续步骤生效，本脚本内用绝对路径验证
          /opt/hostedtoolcache/jdk25/bin/java -version

      - name: Build jar
        shell: bash
        run: |
          # 版本号 = 标签名去掉 v（1.12.1+1.0.0 这种"原作者版本+fork 版本"两段式），
          # 保证 jar 内显示、Release 名、标签三者永远一致
          sed -i "s/^mod_version=.*/mod_version=${GITHUB_REF_NAME#v}/" gradle.properties
          echo "构建版本: $(grep '^mod_version=' gradle.properties)"
          # 依赖与 wrapper 缓存来自 toolcache 卷（act-toolcache 播种服务拷入）
          if [ -d /opt/hostedtoolcache/gradle-home/caches ]; then
            export GRADLE_USER_HOME=/opt/hostedtoolcache/gradle-home
            echo "使用 toolcache 里的 Gradle 缓存"
            # 播种拷贝可能落下写了一半的 transform 工作区（缺元数据 → Gradle 拒绝）。
            # 一次性清掉让它重新派生（本地派生，无需联网），之后保留缓存
            MARK="$GRADLE_USER_HOME/.transforms-clean"
            if [ ! -f "$MARK" ]; then
              rm -rf "$GRADLE_USER_HOME/caches/9.2.1/transforms"
              touch "$MARK"
              echo "已清理不完整的 transforms 缓存（一次性）"
            fi
          fi
          cd workspace/platforms/26.3-neoforge
          ./gradlew build --offline --no-daemon || ./gradlew build --no-daemon
          ls -la build/libs/

      - name: Create release & upload jar
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -e
          API="$GITEA_URL/api/v1"
          TAG="${GITHUB_REF_NAME:-manual}"
          JAR="workspace/platforms/26.3-neoforge/build/libs/mcphone-*.jar"
          JAR_FILE=$(ls $JAR | grep -v sources | head -1)   # 展开通配符并排除 sources jar
          [ -f "$JAR_FILE" ] || { echo "没找到 jar: $JAR"; exit 1; }
          ASSET=$(echo "mcphone-26.3-neoforge-${TAG}.jar" | tr '+' '_')   # + 在 URL query 里会变空格

          REL_ID=$(curl -skf -X POST -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"MCphone $TAG\",\"body\":\"CI 自动构建（26.3-neoforge，Java 25）\"}" \
            "$API/repos/AllisamWorkshop/mcphone-extended/releases" \
            | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))" || true)
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -skf -H "Authorization: token $GITEA_TOKEN" \
              "$API/repos/AllisamWorkshop/mcphone-extended/releases/tags/$TAG" \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))")
          fi
          if [ -z "$REL_ID" ]; then echo "拿不到 Release id，终止"; exit 1; fi

          curl -skf -X DELETE -H "Authorization: token $GITEA_TOKEN" \
            "$API/repos/AllisamWorkshop/mcphone-extended/releases/$REL_ID/assets?name=$ASSET" || true
          curl -skf -X POST -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$JAR_FILE" \
            "$API/repos/AllisamWorkshop/mcphone-extended/releases/$REL_ID/assets?name=$ASSET"
          echo "已上传 $ASSET 到 Release #$REL_ID"
